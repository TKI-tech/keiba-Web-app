# Render Blueprint。Renderダッシュボードの「New +」→「Blueprint」でこのリポジトリを
# 選ぶと、この内容から自動でサービスが作成される。
#
# 注意:
# - plan: starter + 永続ディスクにしてある(有料)。実際の会員・課金者が使うため、
#   (1) 再デプロイ・スリープ復帰のたびに会員データが消える、(2) 15分無アクセスで
#   スリープし次回アクセス時に数十秒待たされる、という無料プランの制約は許容できない
#   ため。デモ検証だけでよい場合は plan を free に戻し、disk セクションをコメント
#   アウトすればよい。
# - sync: false の環境変数は、Renderダッシュボードの Environment 画面で手動設定する
#   (Stripeの秘密鍵などをrender.yamlにコミットしないため)。
# - PORT を明示的に指定しているのは、指定しないとRenderがコンテナ内の複数の開いた
#   ポート(Caddy/Streamlit/webhook_server)から自動検出を試み、Caddy以外(例:
#   Streamlitの8501番)を誤って外部公開ポートとして選んでしまうことがあるため。
#   PORTを固定すればCaddyがそのポートで待ち受け、Renderも確実にそこへルーティングする。
services:
  - type: web
    name: keiba-web-app
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: PORT
        value: "10000"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      # メール送信(確認メール・パスワード再設定)はResendのHTTPS APIを使う。SMTPは
      # Render上でポートがブロックされ接続がタイムアウトすることを確認済みのため不採用。
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # テスト用マスターアカウント(任意)。設定するとStripe決済なしに会員限定画面を
      # 確認できてしまうため、強いパスワードを使うか、確認が終わったら値を消すこと。
      - key: MASTER_EMAIL
        sync: false
      - key: MASTER_PASSWORD
        sync: false
    disk:
      name: keiba-data
      mountPath: /app/data
      sizeGB: 1

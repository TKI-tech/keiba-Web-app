# Render Blueprint。Renderダッシュボードの「New +」→「Blueprint」でこのリポジトリを
# 選ぶと、この内容から自動でサービスが作成される。
#
# 注意:
# - plan: free は無料だが、(1) 永続ディスクが使えない(会員・予想実績DBは再デプロイや
#   スリープ復帰のたびに消える)、(2) 15分アクセスがないとスリープし次回アクセス時に
#   起動し直す(数十秒待たされる)という制約がある。デモ公開としてはこれで十分。
#   データを残したい・スリープさせたくない場合は plan を starter に変え、以下の
#   disk セクションのコメントを外す(Renderの有料プランが必要)。
# - sync: false の環境変数は、Renderダッシュボードの Environment 画面で手動設定する
#   (Stripeの秘密鍵などをrender.yamlにコミットしないため)。
# - PORT を明示的に指定しているのは、指定しないとRenderがコンテナ内の複数の開いた
#   ポート(Caddy/Streamlit/webhook_server)から自動検出を試み、Caddy以外(例:
#   Streamlitの8501番)を誤って外部公開ポートとして選んでしまうことがあるため。
#   PORTを固定すればCaddyがそのポートで待ち受け、Renderも確実にそこへルーティングする。
services:
  - type: web
    name: keiba-web-app
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      # メール送信(確認メール・パスワード再設定)はResendのHTTPS APIを使う。SMTPは
      # Render上でポートがブロックされ接続がタイムアウトすることを確認済みのため不採用。
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # テスト用マスターアカウント(任意)。設定するとStripe決済なしに会員限定画面を
      # 確認できてしまうため、強いパスワードを使うか、確認が終わったら値を消すこと。
      - key: MASTER_EMAIL
        sync: false
      - key: MASTER_PASSWORD
        sync: false
